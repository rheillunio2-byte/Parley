<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Architecture: the browser talks to the coordinator on port 18100, which discovers and delegates to the research, analysis and report agents on ports 18101 to 18103.">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd4ff"/><stop offset="1" stop-color="#9a86ff"/></linearGradient>
<filter id="blur" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.4"/></filter>
<pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><rect x="19" y="19" width="2" height="2" fill="#96b2ff" opacity=".18"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#8fa8ff" fill-opacity=".7"/></marker>
</defs>
<rect width="1000" height="560" rx="22" fill="#070a14"/><rect width="1000" height="560" rx="22" fill="url(#dots)"/>
<rect x=".75" y=".75" width="998.5" height="558.5" rx="21.5" fill="none" stroke="#8fa8ff" stroke-opacity=".2"/>

<rect x="380" y="28" width="240" height="64" rx="14" fill="#0b1226" stroke="#eaf0ff" stroke-opacity=".75" stroke-width="1.4"/><text x="500.0" y="56" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.6" fill="#eaf0ff">BROWSER</text><text x="500.0" y="78" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#b9c6e4">Parley dashboard</text>
<rect x="300" y="170" width="400" height="84" rx="14" fill="#0b1226" stroke="url(#g)" stroke-opacity=".75" stroke-width="1.4"/><text x="500.0" y="198" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.6" fill="url(#g)">COORDINATOR  :18100</text><text x="500.0" y="220" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#b9c6e4">Discovers Agent Cards · delegates tasks · serves the UI</text><text x="500.0" y="240" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7f8db0">client agent</text>
<rect x="40" y="396" width="260" height="90" rx="14" fill="#0b1226" stroke="#5fd4ff" stroke-opacity=".75" stroke-width="1.4"/><text x="170.0" y="424" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.6" fill="#5fd4ff">RESEARCH  :18101</text><text x="170.0" y="446" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#b9c6e4">Structured research brief</text><text x="170.0" y="466" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7f8db0">research_topic → research-result.txt</text>
<rect x="370" y="396" width="260" height="90" rx="14" fill="#0b1226" stroke="#9a86ff" stroke-opacity=".75" stroke-width="1.4"/><text x="500.0" y="424" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.6" fill="#9a86ff">ANALYSIS  :18102</text><text x="500.0" y="446" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#b9c6e4">Themes and recommendations</text><text x="500.0" y="466" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7f8db0">analyze_brief → analysis-result.txt</text>
<rect x="700" y="396" width="260" height="90" rx="14" fill="#0b1226" stroke="#4fe3b0" stroke-opacity=".75" stroke-width="1.4"/><text x="830.0" y="424" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.6" fill="#4fe3b0">REPORT  :18103</text><text x="830.0" y="446" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" font-size="13" fill="#b9c6e4">Final report artifact</text><text x="830.0" y="466" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#7f8db0">write_report → writer-result.txt</text>
<path d="M500 92V170" stroke="#8fa8ff" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="3 6" fill="none" marker-end="url(#arr)"/>
<text x="516" y="124" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9fb2dc">POST /api/run-stream</text>
<text x="516" y="143" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6f7ea3">← NDJSON progress events</text>
<path d="M500 254V325H170V396" fill="none" stroke="#8fa8ff" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 6"/>
<path d="M500 254V325H500V396" fill="none" stroke="#8fa8ff" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 6"/>
<path d="M500 254V325H830V396" fill="none" stroke="#8fa8ff" stroke-opacity=".4" stroke-width="1.4" stroke-dasharray="3 6"/>
<text x="500" y="300" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#9fb2dc" >GET /.well-known/agent-card.json</text>
<text x="330" y="368" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6f7ea3" transform="rotate(0)">POST /rpc · tasks/send ↓</text>
<text x="670" y="368" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6f7ea3">↑ artifact</text>
<circle r="5.5" fill="#eaf0ff" filter="url(#blur)"><animateMotion path="M500 92V170" dur="10s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.08;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.07;0.08;1" dur="10s" begin="0s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#4fe3b0" filter="url(#blur)"><animateMotion path="M500 170V92" dur="10s" begin="8.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.08;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.07;0.08;1" dur="10s" begin="8.6s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#5fd4ff" filter="url(#blur)"><animateMotion path="M500 254V325H170V396" dur="10s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.11;0.12;1" dur="10s" begin="0.8s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#4fe3b0" filter="url(#blur)"><animateMotion path="M170 396V325H500V254" dur="10s" begin="2.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.11;0.12;1" dur="10s" begin="2.2s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#9a86ff" filter="url(#blur)"><animateMotion path="M500 254V325H500V396" dur="10s" begin="3.2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.11;0.12;1" dur="10s" begin="3.2s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#4fe3b0" filter="url(#blur)"><animateMotion path="M500 396V325H500V254" dur="10s" begin="4.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.11;0.12;1" dur="10s" begin="4.6s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#4fe3b0" filter="url(#blur)"><animateMotion path="M500 254V325H830V396" dur="10s" begin="5.6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.11;0.12;1" dur="10s" begin="5.6s" repeatCount="indefinite"/></circle>
<circle r="5.5" fill="#4fe3b0" filter="url(#blur)"><animateMotion path="M830 396V325H500V254" dur="10s" begin="7.0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.11;0.12;1" dur="10s" begin="7.0s" repeatCount="indefinite"/></circle>
<text x="500" y="530" text-anchor="middle" font-family="Inter,ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif" font-size="13.5" fill="#8f9bb8">Requests travel down, artifacts travel back up. The coordinator chains each artifact into the next request.</text>
</svg>